name: Récupérer les vidéos HeyGen
on:
  push:
    branches: [main]
    paths: ['queue/*.txt']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fetch-videos
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Télécharger les vidéos en attente
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(queue/*.txt)
          [ ${#files[@]} -eq 0 ] && { echo "File vide"; exit 0; }
          for f in "${files[@]}"; do
            while read -r dest url || [ -n "${dest:-}" ]; do
              [ -z "${dest:-}" ] && continue
              case "$dest" in \#*) continue;; esac
              case "$dest" in *..*) echo "Destination refusée : $dest"; exit 1;; esac
              case "$dest" in media/*.mp4) ;; *) echo "Destination refusée : $dest"; exit 1;; esac
              case "$url" in https://*.heygen.ai/*|https://*.heygen.com/*) ;; *) echo "URL refusée pour $dest"; exit 1;; esac
              mkdir -p "$(dirname "$dest")"
              curl -fsSL --retry 3 --max-filesize 300000000 -o "$dest" "$url"
              echo "OK $dest ($(du -h "$dest" | cut -f1))"
            done < "$f"
            git rm -q "$f"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add media
          git commit -m "Vidéos HeyGen rapatriées"
          git push
